# Ambiente di sviluppo locale: PostgreSQL + Mailpit (cattura le email inviate dall'app).
# Mailpit UI: http://localhost:8035
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campionature
      POSTGRES_PASSWORD: campionature
      POSTGRES_DB: campionature
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campionature"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1035:1025"
      - "127.0.0.1:8035:8025"

volumes:
  pgdata:
